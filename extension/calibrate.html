<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>눈길 시선 교정</title>
  <style>
    :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --accent: #0071e3; --tint: rgba(0, 113, 227, .1); --bad: #d70015; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #98989d; --accent: #0a84ff; --tint: rgba(10, 132, 255, .18); --bad: #ff6961; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 19px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 600px; padding: 48px 16px; text-align: center; }
    h1 { font-size: clamp(36px, 6vw, 52px); line-height: 1.08; font-weight: 700; letter-spacing: -.03em; margin: 0 0 16px; }
    p { margin: 0 0 20px; color: var(--muted); }
    video { display: block; width: 100%; max-width: 420px; aspect-ratio: 4/3; object-fit: cover; transform: scaleX(-1); border-radius: 24px; background: #000; margin: 8px auto 20px; box-shadow: 0 18px 50px rgba(0, 0, 0, .18); }
    button { font: inherit; font-weight: 600; font-size: 17px; padding: 13px 28px; border-radius: 980px; border: 0; background: var(--accent); color: #fff; cursor: pointer; transition: transform .1s ease-out, opacity .2s; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: default; }
    button.secondary { background: var(--tint); color: var(--accent); margin-left: 8px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #faceState { font-weight: 600; color: var(--fg); }
    #error { color: var(--bad); font-weight: 600; }
    [hidden] { display: none !important; }
    #stage { position: fixed; inset: 0; background: #000; cursor: none; }
    #dot { z-index: 2; position: fixed; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #0a84ff; border: 4px solid #fff; box-shadow: 0 0 30px rgba(10, 132, 255, .7); transition: left .5s cubic-bezier(.2, .8, .2, 1), top .5s cubic-bezier(.2, .8, .2, 1); }
    #dot.collect { transform: scale(.55); transition: left .5s cubic-bezier(.2, .8, .2, 1), top .5s cubic-bezier(.2, .8, .2, 1), transform .3s cubic-bezier(.2, .8, .2, 1); }
    #dot.off { opacity: 0; }
    #phase { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; padding: 24px; text-align: center; opacity: 0; transition: opacity .9s ease; pointer-events: none; }
    #phase.on { opacity: 1; }
    #phase::before { content: ''; position: absolute; inset: -20%; z-index: -1; background: radial-gradient(38% 42% at 32% 42%, rgba(10, 132, 255, .34), transparent 70%), radial-gradient(34% 40% at 68% 38%, rgba(191, 90, 242, .3), transparent 70%), radial-gradient(40% 40% at 52% 68%, rgba(255, 55, 95, .22), transparent 70%); filter: blur(30px); animation: drift 7s ease-in-out infinite alternate; }
    #phaseTitle { margin: 0; font-size: clamp(38px, 6.4vw, 72px); line-height: 1.12; font-weight: 700; letter-spacing: -.035em; word-break: keep-all; background: linear-gradient(100deg, #64d2ff, #0a84ff, #bf5af2, #ff375f, #64d2ff); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 5s linear infinite; }
    #phaseSub { margin: 0; color: #d1d1d6; font-size: clamp(19px, 2.4vw, 26px); letter-spacing: -.015em; word-break: keep-all; }
    @keyframes flow { to { background-position: -300% 0; } }
    @keyframes drift { to { transform: scale(1.12) translate(2%, -2%); } }
    section:not([hidden]) { animation: enter .7s cubic-bezier(.2, .8, .2, 1); }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) {
      #phaseTitle, #phase::before, section:not([hidden]) { animation: none; }
      #phaseTitle { color: #fff; background: none; }
      #phase { transition: opacity .2s; }
    }
    .scan { position: relative; width: min(340px, 72vw); aspect-ratio: 1; margin: 12px auto 26px; }
    .scan video { position: absolute; left: 11%; top: 11%; width: 78%; height: 78%; max-width: none; margin: 0; aspect-ratio: auto; object-fit: cover; border-radius: 50%; box-shadow: none; animation: breathe 3.4s ease-in-out infinite; }
    .scan.full video { animation: none; }
    .ticks { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .ticks line { stroke: rgba(134, 134, 139, .38); stroke-width: 3; stroke-linecap: round; transition: stroke .35s ease, stroke-width .35s cubic-bezier(.2, .8, .2, 1); }
    .ticks line.lit { stroke: #30d158; stroke-width: 3.6; }
    .scan:not(.full) .ticks.waiting line:not(.lit) { animation: shimmer 2.2s ease-in-out infinite; animation-delay: var(--d); }
    @keyframes shimmer { 50% { stroke: rgba(134, 134, 139, .85); } }
    @keyframes breathe { 50% { transform: scale(.975); } }
    #stageRing { position: fixed; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; transition: opacity .6s ease; }
    #stageRing.off { opacity: 0; }
    #stageRing line { stroke: rgba(255, 255, 255, .22); stroke-width: 4; }
    #stageRing line.lit { stroke: #30d158; }
    #success { display: block; width: 112px; height: 112px; margin: 0 auto 20px; }
    #success[hidden] { display: none; }
    #success circle, #success path { fill: none; stroke: #30d158; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    #success circle { stroke-dasharray: 283; stroke-dashoffset: 283; transform: rotate(-90deg); transform-origin: center; animation: draw .8s cubic-bezier(.2, .8, .2, 1) forwards; }
    #success path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .45s .55s cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .scan video, .ticks.waiting line { animation: none !important; }
      .ticks line { transition: none; }
      #success circle, #success path { animation: none; stroke-dashoffset: 0; }
    }
    #stageText { position: fixed; left: 50%; top: 50%; transform: translate(-50%, 56px); color: #a1a1a6; font-size: 17px; text-align: center; letter-spacing: -.01em; }
    @media (prefers-reduced-motion: reduce) { #dot, #dot.collect { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section id="intro">
      <h1 id="introTitle">시선 교정</h1>
      <p>카메라 영상은 이 기기 안에서만 처리돼요. 음성은 크롬 음성 인식 서비스로 전송될 수 있어요.</p>
      <p id="error" hidden></p>
      <button id="allow">카메라·마이크 허용</button>
      <button id="later" class="secondary" hidden>나중에 할게요</button>
    </section>

    <section id="ready" hidden>
      <h1>얼굴을 맞춰 주세요</h1>
      <div class="scan" id="scan">
        <video id="preview" muted playsinline autoplay></video>
        <svg class="ticks waiting" id="scanTicks" viewBox="0 0 200 200" aria-hidden="true"></svg>
      </div>
      <p id="faceState">얼굴을 찾는 중…</p>
      <p>평소 앉는 자세로 앉아 주세요. 화면 안내에 따라 점을 차례로 바라보면 돼요. 1분쯤 걸려요. "다음"이라고 말해도 시작돼요.</p>
      <button id="begin" disabled>교정 시작</button>
    </section>

    <section id="done" hidden>
      <svg id="success" viewBox="0 0 100 100" aria-hidden="true" hidden><circle cx="50" cy="50" r="45"/><path d="M30 52 L45 66 L71 37"/></svg>
      <h1 id="doneTitle">교정 완료</h1>
      <p id="resultText"></p>
      <button id="finish">닫기</button>
      <button id="again" class="secondary">다시 하기</button>
    </section>
  </main>

  <div id="stage" hidden>
    <svg id="stageRing" class="off" viewBox="0 0 200 200" aria-hidden="true"></svg>
    <div id="dot" class="off"></div>
    <div id="phase"><h2 id="phaseTitle"></h2><p id="phaseSub"></p></div>
    <div id="stageText"></div>
  </div>
  <script src="lib/strings.js"></script>
  <script src="lib/gaze-model.js"></script>
  <script src="calibrate.js"></script>
</body>
</html>
