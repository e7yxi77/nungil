<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #f2f2f7; --card: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: rgba(60, 60, 67, .16); --accent: #0071e3; --bad: #d70015; --tint: rgba(0, 113, 227, .1); }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: rgba(235, 235, 245, .16); --accent: #0a84ff; --bad: #ff6961; --tint: rgba(10, 132, 255, .18); } }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; padding: 18px 14px 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -.005em; -webkit-font-smoothing: antialiased; }
    h1 { font-size: 26px; line-height: 1.1; font-weight: 700; letter-spacing: -.03em; margin: 2px 4px 14px; }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 9px 14px; background: var(--card); box-shadow: inset 0 -.5px 0 var(--line); }
    label.row:first-of-type { border-radius: 14px 14px 0 0; }
    label.row:last-of-type { border-radius: 0 0 14px 14px; box-shadow: none; margin-bottom: 12px; }
    label.row small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
    label.row > span br { display: none; }
    input[type=checkbox] { appearance: none; flex: none; width: 42px; height: 26px; margin: 0; border-radius: 13px; background: rgba(120, 120, 128, .32); position: relative; cursor: pointer; transition: background .22s cubic-bezier(.2, .8, .2, 1); }
    input[type=checkbox]::after { content: ''; position: absolute; left: 2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
    input[type=checkbox]:checked { background: #34c759; }
    input[type=checkbox]:checked::after { transform: translateX(16px); }
    input[type=range] { width: 130px; accent-color: var(--accent); }
    select { font: inherit; padding: 4px 8px; background: transparent; color: var(--accent); border: 0; text-align: right; cursor: pointer; }
    button { width: 100%; font: inherit; font-weight: 600; padding: 11px; margin-top: 8px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; transition: transform .1s ease-out; }
    button:active { transform: scale(.97); }
    button.secondary { background: var(--tint); color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; padding: 12px 14px; background: var(--card); border-radius: 14px; font-size: 13px; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-weight: 500; }
    dd.bad { color: var(--bad); }
    p { margin: 10px 4px 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
    small { color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <h1>눈길</h1>
  <label class="row"><span>켜기</span><input type="checkbox" id="enabled"></label>
  <label class="row"><span>응시 클릭</span><input type="checkbox" id="dwell"></label>
  <label class="row"><span>응시 시간 <b id="dwellValue"></b></span><input type="range" id="dwellMs" min="800" max="3000" step="100"></label>
  <label class="row"><span>입 벌리기<br><small>아래로 스크롤</small></span><input type="checkbox" id="mouth"></label>
  <label class="row"><span>AI 자동 수행<br><small>"지메일 들어가서 메일 작성해줘" (로그인 필요)</small></span><input type="checkbox" id="agent"></label>
  <label class="row"><span>소리 조작<br><small>"팝" 클릭 · 허밍 스크롤 (음성 명령 꺼짐)</small></span><input type="checkbox" id="sound"></label>
  <label class="row"><span>커서</span>
    <select id="cursor"><option value="eyes">눈 + 머리</option><option value="head">머리만</option></select>
  </label>
  <dl>
    <dt>카메라</dt><dd id="camera">-</dd>
    <dt>얼굴</dt><dd id="face">-</dd>
    <dt>음성</dt><dd id="voice">-</dd>
    <dt>시선 오차</dt><dd id="model">-</dd>
  </dl>
  <button id="recenter" class="secondary">시선 맞춤 (2초)</button>
  <button id="calibrate">시선 교정</button>
  <button id="codex" class="secondary">ChatGPT 로그인 (AI 기능)</button>
  <p>카메라는 기기 안에서만 처리돼요. 음성은 크롬 음성 인식 서비스로 전송될 수 있어요.</p>
  <p>로그인하면 AI 기능을 쓸 때 페이지 본문이나 화면의 항목 이름, AI 자동 수행 중에는 말한 내용과 페이지 주소가 내 ChatGPT 계정으로 전송돼요. 입력 칸의 내용은 보내지 않아요. 비공식 연결 방식이라 언제든 멈출 수 있어요.</p>
  <script src="lib/strings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
