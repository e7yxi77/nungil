<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #fff; --fg: #111; --muted: #555; --line: #ddd; --accent: #ffc107; --bad: #d32f2f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #f2f2f2; --muted: #aaa; --line: #3a3a3a; --bad: #ff6b6b; } }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    label.row, .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
    input[type=range] { width: 130px; accent-color: var(--accent); }
    select { font: inherit; padding: 4px 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
    button { width: 100%; font: inherit; font-weight: 700; padding: 11px; margin-top: 10px; border-radius: 9px; border: 2px solid #111; background: var(--accent); color: #111; cursor: pointer; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-weight: 600; }
    dd.bad { color: var(--bad); }
    p { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
    small { color: var(--muted); }
    button.secondary { background: transparent; color: var(--fg); border-color: var(--line); }
  </style>
</head>
<body>
  <h1>눈길 Nungil</h1>
  <label class="row"><span>켜기 / On</span><input type="checkbox" id="enabled"></label>
  <label class="row"><span>응시 클릭 / Dwell click</span><input type="checkbox" id="dwell"></label>
  <label class="row"><span>응시 시간 <b id="dwellValue"></b></span><input type="range" id="dwellMs" min="800" max="3000" step="100"></label>
  <label class="row"><span>입 벌리기 / Open mouth<br><small>아래로 스크롤</small></span><input type="checkbox" id="mouth"></label>
  <label class="row"><span>AI 자동 수행 / AI tasks<br><small>"지메일 들어가서 메일 작성해줘" (로그인 필요)</small></span><input type="checkbox" id="agent"></label>
  <label class="row"><span>소리 조작 / Sound control<br><small>"팝" 클릭 · 허밍 스크롤 (음성 명령 꺼짐)</small></span><input type="checkbox" id="sound"></label>
  <label class="row"><span>커서 / Cursor</span>
    <select id="cursor"><option value="eyes">눈 + 머리 / Eyes + head</option><option value="head">머리만 / Head only</option></select>
  </label>
  <label class="row"><span>언어 / Language</span>
    <select id="lang"><option value="ko-KR">한국어</option><option value="en-US">English</option></select>
  </label>
  <dl>
    <dt>카메라</dt><dd id="camera">-</dd>
    <dt>얼굴</dt><dd id="face">-</dd>
    <dt>음성</dt><dd id="voice">-</dd>
    <dt>시선 오차</dt><dd id="model">-</dd>
  </dl>
  <button id="recenter" class="secondary">시선 맞춤 (2초) / Recenter</button>
  <button id="calibrate">시선 교정 / Calibrate</button>
  <button id="codex" class="secondary">ChatGPT 로그인 (AI 기능)</button>
  <p>카메라는 기기 안에서만 처리돼요. 음성은 크롬 음성 인식 서비스로 전송될 수 있어요.</p>
  <p>로그인하면 AI 기능을 쓸 때 페이지 본문이나 화면의 항목 이름, AI 자동 수행 중에는 말한 내용과 페이지 주소가 내 ChatGPT 계정으로 전송돼요. 입력 칸의 내용은 보내지 않아요. 비공식 연결 방식이라 언제든 멈출 수 있어요.</p>
  <script src="lib/strings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
