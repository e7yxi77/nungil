<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>눈길 ChatGPT 로그인</title>
  <style>
    :root { --bg: #fff; --fg: #111; --muted: #555; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #f2f2f2; --muted: #aaa; } }
    body { margin: 0; padding: 72px 16px; background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 30px; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 12px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">로그인 확인 중 · Signing in</h1>
    <p id="message">잠시만 기다려 주세요. · Please wait.</p>
  </main>
  <script src="signin.js"></script>
</body>
</html>
