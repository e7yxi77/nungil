<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>눈길 ChatGPT 로그인</title>
  <style>
    :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #98989d; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 19px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; text-align: center; }
    main { max-width: 560px; padding: 16px; }
    h1 { font-size: 44px; line-height: 1.08; font-weight: 700; letter-spacing: -.03em; margin: 0 0 14px; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">로그인 확인 중</h1>
    <p id="message">잠시만 기다려 주세요.</p>
  </main>
  <script src="signin.js"></script>
</body>
</html>
